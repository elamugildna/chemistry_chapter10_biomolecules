<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biomolecules Study Portal</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--fg:#14142b;--mut:#6b7185;--line:#e6e8f0;--ind:#4f46e5;--indl:#eef0ff;--grn:#059669;--grnl:#e8f8f1;--red:#dc2626;--redl:#fdecec;--amb:#b45309;--dark:#0f0f23}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.hin{max-width:1010px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:34px;height:34px;border-radius:9px;background:var(--ind);color:#fff;font-weight:700;display:grid;place-items:center;font-size:.85rem}
.brand b{display:block;font-size:1.02rem;line-height:1.2}.brand small{color:var(--mut);font-size:.74rem}
nav{display:flex;gap:2px;background:var(--bg);padding:4px;border-radius:10px;flex-wrap:wrap}
nav button{border:0;background:none;padding:7px 12px;border-radius:8px;font:inherit;font-size:.84rem;font-weight:600;color:#3a3f55;cursor:pointer}
nav button.on{background:#fff;color:var(--amb);box-shadow:0 1px 3px #0001}
main{max-width:1010px;margin:0 auto;padding:22px 16px 60px}
.hero{background:linear-gradient(135deg,#0f0f23,#25196b);color:#fff;border-radius:16px;padding:26px 28px}
.pill{display:inline-block;background:#ffffff1f;border:1px solid #ffffff2e;border-radius:7px;font-size:.72rem;font-weight:600;padding:3px 10px;margin-bottom:12px}
.hero h1{margin:0 0 8px;font-size:1.9rem;line-height:1.2}
.hero p{margin:0 0 18px;max-width:660px;color:#dcdcf5}
.btn{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;margin:0 6px 6px 0}
.b1{background:#fff;color:var(--fg)}.b2{background:var(--ind);color:#fff}.b3{background:#ffffff1f;color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.st small{color:var(--mut);font-size:.7rem;font-weight:700;letter-spacing:.05em}
.st .n{font-size:1.6rem;font-weight:800;margin:2px 0}.st .s{color:var(--mut);font-size:.78rem}
.bar{height:6px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ind)}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.mod .tg{font-size:.72rem;font-weight:700;background:var(--indl);color:var(--ind);padding:3px 9px;border-radius:6px}
.mod.g .tg{background:var(--grnl);color:var(--grn)}
.mod h3{margin:12px 0 6px}.mod p{color:var(--mut);font-size:.86rem;margin:0 0 14px}
.mod .btn{margin:0 6px 0 0;font-size:.82rem}
.mod .p1{background:var(--ind);color:#fff}.mod .p2{background:var(--indl);color:var(--ind)}
.mod.g .p1{background:var(--grn)}.mod.g .p2{background:var(--grnl);color:var(--grn)}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.top h2{margin:0;font-size:1.3rem}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;font:inherit;font-size:.84rem;font-weight:600;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--ind);color:#fff}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filt button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font:inherit;font-size:.78rem;cursor:pointer;color:var(--mut)}
.filt button.on{border-color:var(--ind);color:var(--ind);background:var(--indl)}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.meta{display:flex;gap:8px;align-items:center;font-size:.74rem;margin-bottom:6px;flex-wrap:wrap}
.meta .no{font-weight:800;color:var(--ind)}.meta .tag{background:var(--indl);color:var(--ind);padding:2px 8px;border-radius:6px;font-weight:700}
.g .meta .tag,.q.g .tag{background:var(--grnl);color:var(--grn)}.meta .tp{color:var(--mut)}
.meta .rb{color:var(--amb);background:#fff4e5;border-radius:6px;padding:2px 7px;font-weight:600}.meta .rb.v{color:var(--grn);background:var(--grnl)}
.q p{margin:0 0 10px;font-weight:600}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin:6px 0;font:inherit;cursor:pointer;color:var(--fg)}
.opt:hover:not([disabled]){border-color:var(--ind);background:var(--indl)}
.opt b{display:inline-block;width:22px;color:var(--mut)}
.opt.ok{background:var(--grnl);border-color:var(--grn)}.opt.bad{background:var(--redl);border-color:var(--red)}
.opt[disabled]{cursor:default}
.sol{margin-top:10px;background:var(--bg);border-left:3px solid var(--ind);padding:9px 12px;border-radius:6px;font-size:.88rem}
.rd .opt{cursor:default}.rd .opt:hover{border-color:var(--line);background:#fff}
.link{background:none;border:0;color:var(--ind);font:inherit;font-weight:600;font-size:.86rem;cursor:pointer;padding:4px 0}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.note h3{margin:0 0 8px;font-size:1rem}.note ul{margin:0;padding-left:18px}.note li{margin:4px 0}
.note.w{grid-column:1/-1}
table{border-collapse:collapse;width:100%;font-size:.86rem}td,th{border:1px solid var(--line);padding:6px 9px;text-align:left}th{background:var(--bg)}
.disc{font-size:.78rem;color:var(--mut);margin-top:22px}
.reset{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;font-size:.8rem;color:var(--mut);cursor:pointer}
@media(max-width:640px){.hero h1{font-size:1.5rem}.hero{padding:20px}}
</style>
</head>

  <div class="brand"><div class="logo">BM</div><div><b>Biomolecules Study Portal</b><small>KCET &amp; NEET PYQ Question Banks • <span id="hdrN"></span> Aligned Questions</small></div></div>

    <button data-v="home" class="on">Home Portal</button>

</div></header>
<main id="app"></main>

{e:'k',t:'Carbohydrates',y:'KCET 2026',r:1,q:'Statement I: All monosaccharides are reducing sugars. Statement II: Sucrose reduces ammoniacal silver nitrate (Tollens\' reagent).',o:['Both statements are correct','Both statements are incorrect','Statement I is correct but Statement II is incorrect','Statement I is incorrect but Statement II is correct'],a:2,s:'All monosaccharides, aldose or ketose, are reducing. Sucrose is non-reducing because the reducing groups of glucose (C1) and fructose (C2) are tied up in the glycosidic bond.'},
{e:'k',t:'Vitamins',y:'KCET 2026',r:1,q:'Match deficiency symptoms with the vitamin. (A) B₁  (B) B₂  (C) B₆  (D) B₁₂ with (i) Convulsions (ii) Pernicious anaemia (RBC deficient in haemoglobin) (iii) Retarded growth / loss of appetite (iv) Burning sensation of skin',o:['A-iii, B-iv, C-i, D-ii','A-i, B-ii, C-iii, D-iv','A-iv, B-iii, C-ii, D-i','A-ii, B-i, C-iv, D-iii'],a:0,s:'NCERT Table 10.3: B₁ beri-beri (loss of appetite, retarded growth); B₂ cheilosis and burning sensation of skin; B₆ convulsions; B₁₂ pernicious anaemia.'},
{e:'k',t:'Glucose & fructose',y:'KCET 2025',r:1,q:'Match the reagent reacting with glucose to its product. (A) Acetic anhydride (B) Bromine water (C) HI, heat (D) HCN  with (i) n-Hexane (ii) Cyanohydrin (iii) Gluconic acid (iv) Glucose pentaacetate',o:['A-iv, B-iii, C-i, D-ii','A-iii, B-iv, C-ii, D-i','A-i, B-ii, C-iii, D-iv','A-ii, B-i, C-iv, D-iii'],a:0,s:'Acetylation → pentaacetate (five –OH); Br₂ water → gluconic acid (aldehyde → COOH); HI → n-hexane (straight chain); HCN → cyanohydrin (carbonyl).'},
{e:'k',t:'Amino acids & proteins',y:'KCET 2025',r:1,q:'The correct sequence of α-amino acid, hormone, vitamin and carbohydrate respectively is',o:['Alanine, thyroxine, ascorbic acid, maltose','Thyroxine, alanine, maltose, ascorbic acid','Maltose, alanine, thyroxine, ascorbic acid','Alanine, ascorbic acid, thyroxine, maltose'],a:0,s:'Alanine is an α-amino acid, thyroxine a hormone, ascorbic acid is vitamin C, maltose a disaccharide.'},
{e:'k',t:'Disaccharides & polysaccharides',y:'KCET 2025',r:1,q:'Which carbohydrates contain an α-glycosidic link in their structure? (i) Sucrose (ii) Maltose (iii) Lactose (iv) Cellulose (v) Starch',o:['(i), (ii) and (v)','(ii), (iii) and (iv)','(iii) and (iv) only','(i), (iii) and (iv)'],a:0,s:'Sucrose (α-glucose C1 to C2), maltose (α-C1–C4) and starch (α-C1–C4, α-C1–C6) have α links. Lactose and cellulose have β links.'},

{e:'k',t:'Hormones',y:'KCET 2024',r:1,q:'The female sex hormone responsible for development of secondary female characteristics and control of the menstrual cycle is',o:['Testosterone','Progesterone','Estradiol','Glucagon'],a:2,s:'Estradiol is the main female sex hormone. Progesterone prepares the uterus for implantation; testosterone is the male hormone.'},
{e:'k',t:'Disaccharides & polysaccharides',y:'KCET 2023',r:1,q:'Sucrose is dextrorotatory, but after hydrolysis the mixture is laevorotatory because',o:['Laevorotation of fructose (−92.4°) exceeds dextrorotation of glucose (+52.5°)','Glucose is more dextrorotatory than fructose is laevorotatory','Both products are laevorotatory','Sucrose racemises on hydrolysis'],a:0,s:'Equimolar glucose + fructose gives a net negative rotation: this is invert sugar.'},

{e:'k',t:'Nucleic acids',y:'KCET 2019',r:1,q:'In nucleic acids, the nucleotides are joined together by',o:['Peptide bonds','Glycosidic bonds','Phosphodiester linkages','Hydrogen bonds'],a:2,s:'Phosphodiester linkage between the 5′ and 3′ positions of sugars.'},

{e:'k',t:'Glucose & fructose',y:'KCET 2018',r:1,q:'The two forms of D-glucopyranose (α and β) are called',o:['Enantiomers','Conformers','Anomers','Epimers'],a:2,s:'They differ only at the hemiacetal (anomeric) carbon C1.'},
{e:'k',t:'Disaccharides & polysaccharides',y:'KCET 2018',r:1,q:'The glycosidic linkage linking glucose units in the amylose part of starch is',o:['α-C1–C4','β-C1–C4','α-C1–C6','β-C1–C6'],a:0,s:'Amylose is an unbranched chain of 200–1000 α-D-glucose units joined by C1–C4 α-links.'},
{e:'k',t:'Disaccharides & polysaccharides',y:'KCET 2017',r:1,q:'The glycosidic linkage present in sucrose is between',o:['C1 of α-D-glucose and C2 of β-D-fructose','C1 of β-D-glucose and C4 of α-D-fructose','C1 of α-D-glucose and C4 of glucose','C1 of galactose and C4 of glucose'],a:0,s:'Both reducing groups are used in the link, so sucrose is non-reducing.'},
{e:'k',t:'Hormones',y:'KCET 2017',r:1,q:'Hormones are secreted by ductless glands. The iodine-containing hormone is',o:['Insulin','Adrenaline','Thyroxine','Testosterone'],a:2,s:'Thyroxine is an iodinated tyrosine derivative.'},
{e:'k',t:'Disaccharides & polysaccharides',y:'KCET 2017',r:2,q:'Pick the wrong statement.',o:['Amylose is the water-soluble component of starch','Amylopectin is a branched chain polymer','Cellulose is made of α-D-glucose units','Glycogen is also called animal starch'],a:2,s:'Cellulose consists of β-D-glucose units joined by β-C1–C4 links.'},

{e:'k',t:'Disaccharides & polysaccharides',y:'KCET-type',q:'Maltose is a reducing sugar because',o:['It contains a free aldehyde group at C1 of the second glucose unit','It has two free ketone groups','Both anomeric carbons are free of linkage','It is composed of glucose and fructose'],a:0,s:'Maltose = two α-D-glucose units (C1–C4); the free C1 of the second unit gives reducing property.'},

/* KCET additions merged from the Gemini file (verified items flagged r:5, others r:4/r:6) */
{e:'k',t:"Enzymes",y:"KCET 2026 (Biology paper)",r:5,q:"The following statements are the steps in the catalytic action of an enzyme. Arrange them in the correct sequence:<br>a) The active site of the enzyme, now in close proximity of the substrate, breaks the chemical bonds of the substrate and the new enzyme-product complex is formed.<br>b) The substrate binds tightly to the enzyme, inducing a change in the active site of the enzyme.<br>c) The enzyme releases the products of the reaction and the free enzyme is ready to bind to another molecule of the substrate.<br>d) The substrate binds to the active site of the enzyme.",o:["c, a, b, d","d, b, a, c","a, b, c, d","d, c, b, a"],a:1,s:"Catalytic mechanism of enzyme action follows 4 sequential steps: (1) Substrate binds to active site of enzyme (d); (2) Binding induces enzyme conformation to fit substrate more tightly (b); (3) Active site breaks chemical bonds forming enzyme-product complex (a); (4) Free enzyme releases products and is ready for another round of catalysis (c). Hence: d -&gt; b -&gt; a -&gt; c."},
{e:'k',t:"Disaccharides & polysaccharides",y:"KCET 2026 (Biology paper)",r:5,q:"Cellulose is an important structural component in plants which is made up of:",o:["Fructose","Galactose","Glucose","Sucrose"],a:2,s:"Cellulose is a linear, unbranched homopolysaccharide composed solely of β-D-glucose units joined by β-(1,4)-glycosidic linkages."},
{e:'k',t:"Enzymes",y:"KCET 2025",r:4,q:"The graph showing the concept of activation energy of an enzyme is given below with potential energy plotted against reaction progress. In the transition state peak, 'M' represents activation energy from substrate without enzyme, and 'N' represents activation energy with enzyme.<br><br>Observe the graph and choose the correct option for M and N:<br><i>(Graph not reproduced here.)</i>",o:["M - Activation energy without enzyme, N - Activation energy with enzyme","M - Activation energy with enzyme, N - Activation energy without enzyme","M - High temperature, High activation energy, N - Low temperature, Low activation energy","M - High substrate, High activation energy, N - Low substrate, Low activation energy"],a:0,s:"Enzymes act as biocatalysts by significantly lowering the activation energy barrier. 'M' corresponds to the higher energy hurdle required in the absence of an enzyme, while 'N' is the reduced activation energy when the enzyme-substrate transition complex is formed."},
{e:'k',t:"Amino acids & proteins",y:"KCET 2024",r:4,q:"Which of the following is the only optically inactive naturally occurring amino acid due to the absence of a chiral carbon?",o:["Alanine","Glycine","Valine","Serine"],a:1,s:"Glycine (H₂N–CH₂–COOH) has two hydrogen atoms attached to the α-carbon, making it achiral and therefore optically inactive."},
{e:'k',t:"Amino acids & proteins",y:"KCET 2023",r:4,q:"In an aqueous medium, an amino acid exists as a dipolar zwitterion because:",o:["Carboxyl group loses a proton and amino group accepts a proton","Both carboxyl and amino groups lose protons","Carboxyl group accepts a proton and amino group loses a proton","It hydrolyses into an alcohol and an amine"],a:0,s:"In aqueous solution, intramolecular proton transfer from the acidic -COOH group to the basic -NH2 group produces the dipolar zwitterion (H₃N⁺–CH(R)–COO⁻), which has no net electrical charge but possesses amphoteric properties."},
{e:'k',t:"Disaccharides & polysaccharides",y:"KCET 2022",r:4,q:"Amylopectin is a water-insoluble fraction of starch that has a branched structure with:",o:["C1-C4 linear glycosidic bonds and C1-C6 branch points","C1-C4 linear and branch bonds only","C1-C6 linear bonds and C1-C4 branches","β-1,4-glycosidic linkages throughout"],a:0,s:"Amylopectin constitutes 80-85% of starch. It consists of α-D-glucose chains formed by α-(1,4)-glycosidic linkages with branch points occurring via α-(1,6)-glycosidic linkages."},
{e:'k',t:"Amino acids & proteins",y:"KCET 2021",r:4,q:"During denaturation of proteins caused by physical changes (heat) or chemical changes (pH variation), which structural levels are destroyed?",o:["Primary and secondary structures","Secondary and tertiary structures, while primary structure remains intact","Primary, secondary, and tertiary structures","Primary structure only"],a:1,s:"Denaturation disrupts weak hydrogen bonds, hydrophobic interactions, and salt bridges, causing uncoiling of secondary helices and tertiary globular conformations; however, strong covalent peptide bonds of the primary sequence remain intact."},
{e:'k',t:"Glucose & fructose",y:"KCET 2021",r:4,q:"On prolonged heating with concentrated hydriodic acid (HI) and red phosphorus, D-glucose yields:",o:["Gluconic acid","Saccharic acid","n-Hexane","Glucose pentaacetate"],a:2,s:"Prolonged heating of D-glucose with HI causes complete reduction of all six carbon atoms into a continuous straight chain of n-hexane, proving that all 6 carbons in glucose form an unbranched chain."},
{e:'k',t:"Enzymes",y:"KCET 2020",r:4,q:"The non-protein chemical component bound to an apoenzyme to render it catalytically active is called:",o:["Apoenzyme","Co-factor","Zymogen","Substrate"],a:1,s:"A holoenzyme is formed by the protein part (apoenzyme) combined with a non-protein constituent called a co-factor (which can be a prosthetic group, co-enzyme, or metal ion activator)."},
{e:'k',t:"Vitamins",y:"KCET 2018",r:4,q:"Deficiency of Vitamin B₁ (Thiamine) in the human diet causes which disorder?",o:["Cheilosis","Beri-beri","Scurvy","Pernicious anaemia"],a:1,s:"Vitamin B₁ (thiamine) deficiency leads to beri-beri (loss of appetite, muscle weakness, and peripheral nerve disorders)."},
{e:'k',t:"Glucose & fructose",y:"KCET 2018",r:4,q:"Reaction of D-glucose with mild bromine water (Br₂/H₂O) oxidizes the terminal aldehyde group to form:",o:["Saccharic acid","Gluconic acid","Sorbitol","Glucaric acid"],a:1,s:"Bromine water selectively oxidizes the aldehyde group (-CHO) at C1 to a carboxylic group (-COOH) without affecting the primary alcohol at C6, producing gluconic acid."},
{e:'k',t:"Amino acids & proteins",y:"KCET 2017",r:4,q:"Which of the following amino acids contains a phenolic group in its side chain?",o:["Phenylalanine","Tyrosine","Tryptophan","Histidine"],a:1,s:"Tyrosine contains a para-hydroxyphenyl side chain (–CH₂–C₆H₄–OH), giving it phenolic reactivity."},
{e:'k',t:"Nucleic acids",y:"KCET 2016",r:4,q:"In the Watson-Crick double helix model of DNA, the nitrogenous bases are linked together by:",o:["Phosphodiester bonds","Specific hydrogen bonds between complementary base pairs","Peptide bonds","Glycosidic linkages"],a:1,s:"In DNA, Adenine pairs with Thymine via two hydrogen bonds (A=T) and Guanine pairs with Cytosine via three hydrogen bonds (G=C)."},
{e:'k',t:"Glucose & fructose",y:"KCET 2014",r:4,q:"The pentaacetate derivative of D-glucose does not react with hydroxylamine (NH₂OH). This indicates that:",o:["D-glucose has no aldehyde group in its cyclic hemiacetal form","Glucose is an aldohexose","All five -OH groups are equivalent","Glucose contains a ketone functional group"],a:0,s:"Glucose pentaacetate locks the anomeric C1 position as an ester. It cannot open into a free aldehyde form in solution, failing to form an oxime with NH₂OH."},
{e:'k',t:"Enzymes",y:"KCET PYQ (no year)",r:6,q:"Enzymes increase the rate of biochemical reactions by:",o:["Increasing the activation energy","Lowering the activation energy of the transition state","Increasing the equilibrium constant of the reaction","Changing the free energy change of the reaction"],a:1,s:"Enzymes accelerate reaction velocity by providing an alternate catalytic pathway with a significantly lower activation energy barrier without altering ΔG or equilibrium."},
{e:'k',t:"Disaccharides & polysaccharides",y:"KCET PYQ (no year)",r:6,q:"Glycogen, the carbohydrate reserve in animal liver and muscles, is structurally most similar to:",o:["Amylose","Amylopectin (more highly branched)","Cellulose","Inulin"],a:1,s:"Glycogen is known as 'animal starch'. Like amylopectin, it consists of α-(1,4) glucan chains with α-(1,6) branches, but branching occurs much more frequently (every 8-12 residues)."},
{e:'k',t:"Amino acids & proteins",y:"KCET PYQ (no year)",r:6,q:"Which of the following amino acids contains sulfur in its structure?",o:["Methionine and Cysteine","Serine and Threonine","Lysine and Arginine","Leucine and Isoleucine"],a:0,s:"Cysteine (with a thiol group -SH) and Methionine (with a thioether group –S–CH₃) are sulfur-containing amino acids."},
{e:'k',t:"Nucleic acids",y:"KCET PYQ (no year)",r:6,q:"A nucleoside differs from a nucleotide in lacking a:",o:["Phosphate group","Nitrogenous purine/pyrimidine base","Pentose sugar","Hydroxyl group"],a:0,s:"Nucleoside = Nitrogenous base + Pentose sugar. Nucleotide = Nitrogenous base + Pentose sugar + Phosphate esterified at the 5'-OH."},
{e:'k',t:"Vitamins",y:"KCET PYQ (no year)",r:6,q:"Cheilosis (fissuring at corners of mouth and lips) is a characteristic deficiency symptom of:",o:["Vitamin B₂ (Riboflavin)","Vitamin B₁₂","Vitamin C","Vitamin A"],a:0,s:"Vitamin B₂ (riboflavin) deficiency causes cheilosis (fissuring at the corners of the mouth), glossitis, and burning sensations on skin."},
{e:'k',t:"Amino acids & proteins",y:"KCET PYQ (no year)",r:6,q:"Which of the following is a basic amino acid containing two amino groups and one carboxyl group?",o:["Lysine","Aspartic acid","Valine","Glutamic acid"],a:0,s:"Lysine and Arginine contain extra basic amino groups in their side chains, giving them basic properties with net positive charges at physiological pH."},
{e:'k',t:"Disaccharides & polysaccharides",y:"KCET PYQ (no year)",r:6,q:"The water-soluble component of starch which constitutes 15-20% and forms an unbranched chain of α-D-glucose is:",o:["Amylose","Amylopectin","Cellulose","Glycogen"],a:0,s:"Amylose is water-soluble, constituting 15-20% of starch. It consists of 200-1000 α-D-(+)-glucose units held together exclusively by C1-C4 glycosidic linkages."},
{e:'k',t:"Nucleic acids",y:"KCET PYQ (no year)",r:6,q:"In DNA, the pentose sugar present is β-D-2-deoxyribose. It differs from β-D-ribose in lacking an oxygen atom at carbon:",o:["C-1'","C-2'","C-3'","C-5'"],a:1,s:"Deoxyribose has a hydrogen atom (-H) instead of a hydroxyl group (-OH) at the C-2' position of the furanose ring."},
{e:'k',t:"Amino acids & proteins",y:"KCET PYQ (no year)",r:6,q:"Globular proteins result when polypeptide chains fold to form a spherical molecular shape. An example is:",o:["Insulin and Albumin","Keratin and Collagen","Myosin and Fibroin","Elastin"],a:0,s:"Insulin and albumins are soluble globular proteins with folded tertiary conformations, whereas keratin and myosin are insoluble fibrous structural proteins."},
{e:'k',t:"Vitamins",y:"KCET PYQ (no year)",r:6,q:"Pernicious anaemia is caused by the deficiency of which vitamin?",o:["Vitamin B₁","Vitamin B6","Vitamin B₁₂ (Cyanocobalamin)","Vitamin C"],a:2,s:"Vitamin B₁₂ deficiency leads to defective RBC maturation, causing pernicious anaemia where erythrocytes are deficient in haemoglobin."},
{e:'k',t:"Amino acids & proteins",y:"KCET PYQ (no year)",r:6,q:"The hormone insulin is chemically a polypeptide that consists of how many amino acids?",o:["51 amino acids (A chain with 21, B chain with 30)","100 amino acids","32 amino acids","84 amino acids"],a:0,s:"Mature human insulin consists of 51 amino acids distributed across two polypeptide chains: an A chain (21 amino acids) and a B chain (30 amino acids) linked by two interchain disulphide bonds."},
{e:'k',t:"Enzymes",y:"KCET PYQ (no year)",r:6,q:"The enzyme maltase hydrolyses maltose into:",o:["Two molecules of D-glucose","Glucose and Fructose","Glucose and Galactose","Fructose and Galactose"],a:0,s:"Maltase specifically hydrolyses the α-(1,4)-glycosidic bond of maltose to release two molecules of α-D-glucose."},
{e:'k',t:"Amino acids & proteins",y:"KCET PYQ (no year)",r:6,q:"Which of the following statements about essential amino acids is correct?",o:["They can be synthesised by the human body","They cannot be synthesised in the body and must be supplied through diet","They are not required for protein synthesis","Glycine and Alanine are essential amino acids"],a:1,s:"Essential amino acids (Val, Leu, Ile, Lys, Met, Phe, Thr, Trp, His, Arg) cannot be synthesized endogenously and must be acquired through food."},
{e:'k',t:"Nucleic acids",y:"KCET PYQ (no year)",r:6,q:"The backbone of a single DNA strand is composed of alternating units of:",o:["Deoxyribose sugar and phosphate groups","Purine and pyrimidine bases","Amino acids and fatty acids","Ribose and nitrogenous bases"],a:0,s:"The structural rails/backbone of DNA are formed by repeating units of pentose sugar and phosphate groups linked by phosphodiester bonds, with nitrogenous bases protruding inwards."},
{e:'k',t:"Carbohydrates",y:"KCET PYQ (no year)",r:6,q:"The general molecular formula for carbohydrates was originally considered as C<sub>x</sub>(H₂O)<sub>y</sub>. Which of the following compounds fits this formula but is NOT a carbohydrate?",o:["Glucose","Acetic acid (CH₃COOH)","Sucrose","Rhamnose"],a:1,s:"Acetic acid (CH₃COOH or C₂(H₂O)₂) fits the C<sub>x</sub>(H₂O)<sub>y</sub> formula but behaves as a monocarboxylic acid, not a polyhydroxy aldehyde or ketone."},
{e:'k',t:"Amino acids & proteins",y:"KCET PYQ (no year)",r:6,q:"The quaternary structure of a protein refers to the:",o:["Sequence of amino acids in a polypeptide chain","Spatial arrangement of two or more distinct polypeptide subunits with respect to each other","Right-handed α-helical coiling","Formation of disulphide linkages between cysteine residues"],a:1,s:"Proteins composed of multiple polypeptide subunits (such as haemoglobin with 2 α and 2 β subunits) exhibit quaternary structure representing the geometric arrangement of these subunits."},

/* NEET additions merged from the Gemini file */
{e:'n',t:"Amino acids & proteins",y:"Re-NEET 2026",r:4,q:"The correct statement about peptides and proteins is:",o:["Tertiary structure of proteins has two or more polypeptide subunits","Only the proteins having a quaternary structure are biologically active","In β-pleated sheet structures, peptide chains are held together by intermolecular hydrogen bonds","In α-helices, the polypeptide chain is twisted into a left-handed screw (helix) through intramolecular hydrogen bonds"],a:2,s:"In β-pleated sheet structures, extended polypeptide chains lie side-by-side held together by intermolecular hydrogen bonds between &gt;C=O and -NH- groups of adjacent chains. (α-helix is a right-handed screw, tertiary structure refers to overall folding of a single chain, and proteins like myoglobin are active in tertiary structure)."},
{e:'n',t:"Amino acids & proteins",y:"Re-NEET 2026",r:5,q:"The amino acid that gives a blood-red colour on treating its sodium fusion extract with sodium nitroprusside is:",o:["Leucine","Threonine","Methionine","Serine"],a:2,s:"Methionine contains both nitrogen and sulphur. In Lassaigne's test they form NaSCN, which gives a blood-red colour (Fe³⁺ thiocyanate complex). Sulphur alone gives a violet colour with sodium nitroprusside. Leucine, threonine and serine have no sulphur."},
{e:'n',t:"Vitamins",y:"Re-NEET 2026",r:4,q:"Match the vitamins in List I with their sources in List II:<br>List I: (A) Vitamin A, (B) Vitamin B₁₂, (C) Vitamin E, (D) Vitamin K<br>List II: (I) Meat, (II) Sunflower oil, (III) Green leafy vegetables, (IV) Carrots<br><br>Choose the correct answer from the options given below:",o:["A-II, B-III, C-IV, D-I","A-IV, B-I, C-II, D-III","A-IV, B-II, C-I, D-III","A-III, B-I, C-IV, D-II"],a:1,s:"Vitamin A is rich in carrots (A-IV); Vitamin B₁₂ is sourced from animal products like meat, fish, curd (B-I); Vitamin E is abundant in vegetable oils such as sunflower and wheat germ oil (C-II); Vitamin K is obtained from green leafy vegetables (D-III)."},
{e:'n',t:"Amino acids & proteins",y:"Re-NEET 2026",r:4,q:"Match List-I with List-II:<br>List I: (A) Starch, (B) Antibody, (C) Concanavalin A, (D) GLUT-4<br>List II: (I) Fights infection, (II) Energy storage, (III) Glucose transport, (IV) Lectin<br><br>Choose the correct option:",o:["A-I, B-II, C-IV, D-III","A-II, B-I, C-IV, D-III","A-II, B-I, C-III, D-IV","A-I, B-II, C-III, D-IV"],a:1,s:"Starch serves as energy storage in plants (A-II); Antibodies are defensive proteins that fight infectious pathogens (B-I); Concanavalin A is a plant lectin (C-IV); GLUT-4 is an insulin-dependent glucose transporter enabling glucose transport into cells (D-III)."},
{e:'n',t:"Cell biochemistry (NEET Biology paper)",y:"Re-NEET 2026",r:4,q:"Arrange the following elements in descending order of their contribution to the percentage weight of the human body:<br>(a) Oxygen, (b) Carbon, (c) Hydrogen, (d) Nitrogen",o:["(a), (b), (d), (c)","(a), (b), (c), (d)","(c), (a), (b), (d)","(b), (a), (c), (d)"],a:0,s:"According to NCERT Table 9.1: Oxygen constitutes ~65.0%, Carbon ~18.5%, Nitrogen ~3.3%, and Hydrogen ~0.5% (dry weight / body mass percentage: O &gt; C &gt; N &gt; H)."},
{e:'n',t:"Enzymes",y:"NEET 2025",r:4,q:"The protein portion of an enzyme is called:",o:["Apoenzyme","Prosthetic group","Cofactor","Coenzyme"],a:0,s:"In a conjugated enzyme (holoenzyme), the protein portion is termed the apoenzyme, while the non-protein catalytic partner is called a co-factor."},
{e:'n',t:"Nucleic acids",y:"NEET 2025",r:4,q:"Match List-I with List-II:<br>List I: (A) Adenosine, (B) Adenylic acid, (C) Adenine, (D) Alanine<br>List II: (I) Nitrogen base, (II) Nucleotide, (III) Nucleoside, (IV) Amino acid<br><br>Choose the option with all correct matches:",o:["A-III, B-II, C-I, D-IV","A-II, B-III, C-I, D-IV","A-III, B-IV, C-II, D-I","A-III, B-II, C-IV, D-I"],a:0,s:"Adenosine is a purine nucleoside (Adenine + ribose, A-III); Adenylic acid is an adenylyl nucleotide (Adenosine + phosphate, B-II); Adenine is a purine nitrogenous base (C-I); Alanine is an α-amino acid (D-IV)."},
{e:'n',t:"Enzymes",y:"NEET 2025",r:4,q:"Which one of the following enzymes contains 'Haem' as the tightly bound prosthetic group?",o:["Succinate dehydrogenase","Catalase and Peroxidase","RuBisCO","Carbonic anhydrase"],a:1,s:"In catalase and peroxidase, which catalyse the breakdown of toxic hydrogen peroxide into water and oxygen, haem is the tightly bound iron-porphyrin prosthetic group."},
{e:'n',t:"Enzymes",y:"NEET 2025",r:4,q:"Name the class of enzyme that catalyzes the following reaction:<br>S - G + S' -&gt; S + S' - G<br>(Where G is a group other than hydrogen, S is a substrate, and S' is another substrate)",o:["Transferase","Ligase","Hydrolase","Lyase"],a:0,s:"Transferases are enzymes of Class 2 that catalyse the transfer of a specific functional group G (other than hydrogen) between a pair of substrates S and S'."},
{e:'n',t:"Cell biochemistry (NEET Biology paper)",y:"NEET 2024",r:4,q:"Identify the correct statements about biomolecules:<br>A. Lipids are generally water soluble.<br>B. Proteins are polypeptides.<br>C. Polysaccharides are long chains of sugars.<br>D. Adenine and guanine are substituted pyrimidines.<br>E. Almost all enzymes are proteins.<br><br>Choose the correct answer from the options given below:",o:["C, D and E only","B, C and E only","B, D and E only","A, B and C only"],a:1,s:"Statement A is false (lipids are water-insoluble hydrocarbons); Statement D is false (adenine and guanine are double-ringed purines, not pyrimidines). Statements B, C, and E are correct NCERT facts."},
{e:'n',t:"Amino acids & proteins",y:"NEET 2024",r:4,q:"α-helix is found in which level of protein structural organization?",o:["Quaternary structure","Tertiary structure","Primary structure","Secondary structure"],a:3,s:"The α-helix and β-pleated sheets are conformations that belong to the secondary structural level of proteins, arising from regular peptide backbone hydrogen bonding."},
{e:'n',t:"Amino acids & proteins",y:"NEET 2024",r:4,q:"Which of the following statements are correct regarding amino acids?<br>A. They are substituted methanes.<br>B. Serine is an aromatic amino acid.<br>C. Valine is a neutral amino acid.<br>D. Lysine is an acidic amino acid.<br><br>Choose the correct answer from the options given below:",o:["C and D only","A and B only","A and C only","B and C only"],a:2,s:"Statement A is correct (amino acids are substituted methanes with -H, -COOH, -NH2, and variable -R group). Statement B is false (serine is hydroxylic; Tyr, Trp, Phe are aromatic). Statement C is correct (valine is non-polar neutral). Statement D is false (lysine is basic)."},
{e:'n',t:"Amino acids & proteins",y:"NEET 2024",r:4,q:"Match List I with List II:<br>List I: (A) Trypsin, (B) Morphine, (C) Concanavalin A, (D) Collagen<br>List II: (I) Intercellular ground substance, (II) Lectin, (III) Enzyme, (IV) Alkaloid<br><br>Choose the correct answer:",o:["A-III, B-IV, C-II, D-I","A-I, B-II, C-III, D-IV","A-III, B-II, C-IV, D-I","A-IV, B-III, C-II, D-I"],a:0,s:"Trypsin is a proteolytic enzyme (A-III); Morphine is a secondary metabolite alkaloid (B-IV); Concanavalin A is a lectin (C-II); Collagen is the most abundant animal protein serving as intercellular ground substance (D-I)."},
{e:'n',t:"Enzymes",y:"NEET 2024",r:4,q:"The following reaction depicts the activity of a particular class of enzymes:<br>X-C - C-Y -&gt; X-Y + C=C<br>Identify the enzyme class 'E' from the following options:",o:["Ligases","Lyases","Isomerases","Transferases"],a:1,s:"Lyases (Class 4) catalyse the cleavage of chemical bonds by mechanisms other than hydrolysis or oxidation, leaving double bonds in the substrate product."},
{e:'n',t:"Enzymes",y:"NEET 2023",r:4,q:"A competitive inhibitor of an enzyme resembles the substrate in molecular structure and competes for the active site. A classic example is the inhibition of succinate dehydrogenase by:",o:["Malonate","Oxaloacetate","Fumarate","Citrate"],a:0,s:"Malonate closely resembles succinate in chemical structure and competitively inhibits succinate dehydrogenase, reducing the catalytic rate without changing V<sub>max</sub>."},
{e:'n',t:"Disaccharides & polysaccharides",y:"NEET 2023",r:4,q:"Cellulose does not form blue colour with iodine solution because:",o:["It is a branched polymer","It does not contain complex helices and hence cannot trap iodine molecules","It is a disaccharide","It is hydrolysed by iodine"],a:1,s:"Starch forms helical secondary structures where amylose helices trap I₂ molecules to give a deep blue color. Cellulose forms rigid, unbranched β-glycan sheets without helical turns, hence it cannot trap iodine."},
{e:'n',t:"Amino acids & proteins",y:"NEET 2022",r:4,q:"The most abundant protein in the whole of the biosphere and the most abundant protein in animal world are respectively:",o:["RuBisCO and Collagen","Collagen and RuBisCO","Keratin and Insulin","Haemoglobin and Pectin"],a:0,s:"RuBisCO (Ribulose-1,5-bisphosphate carboxylase-oxygenase) is the most abundant protein in the entire biosphere, while Collagen is the most abundant protein in animal extracellular matrix."},
{e:'n',t:"Cell biochemistry (NEET Biology paper)",y:"NEET 2022",r:4,q:"Lipids found in cellular membranes are not strictly macromolecules because:",o:["Their molecular weight does not exceed 800 Daltons, but they form vesicles that are retained in the acid-insoluble retentate during tissue fractionation","They are composed of repeating amino acid monomers","They are completely water soluble","They are polymeric carbohydrates"],a:0,s:"Lipids have small molecular weights (&lt;800 Da) and are micromolecules. However, during tissue homogenization, cell membranes fragment into lipid vesicles that do not dissolve in trichloroacetic acid and get trapped in the acid-insoluble fraction."},
{e:'n',t:"Enzymes",y:"NEET 2021",r:4,q:"Which of the following is an example of an inorganic catalytic co-factor that acts as an essential prosthetic group / activator for carbonic anhydrase?",o:["Zinc (Zn²⁺)","Iron (Fe2+)","Magnesium (Mg2+)","Copper (Cu²⁺)"],a:0,s:"Zinc (Zn²⁺) is an essential co-factor for carbonic anhydrase and carboxypeptidase."},
{e:'n',t:"Disaccharides & polysaccharides",y:"NEET 2021",r:4,q:"Inulin is a storage fructan polysaccharide polymer of:",o:["Glucose","Fructose","Galactose","Arabinose"],a:1,s:"Inulin is a reserve homopolysaccharide composed of linear chains of fructose units linked by β-(2,1)-fructofuranosyl bonds (found in dahlia tubers)."},
{e:'n',t:"Cell biochemistry (NEET Biology paper)",y:"NEET 2020",r:4,q:"Match the following basic biological macromolecules with their linkage types:<br>(A) Protein - (I) Phosphodiester linkage<br>(B) Polysaccharide - (II) Glycosidic linkage<br>(C) Nucleic acid - (III) Peptide linkage<br><br>Choose the correct match:",o:["A-III, B-II, C-I","A-I, B-II, C-III","A-II, B-III, C-I","A-III, B-I, C-II"],a:0,s:"Proteins are linked by peptide bonds (A-III); Polysaccharides are joined by glycosidic bonds (B-II); Nucleic acids are linked by 3'-5' phosphodiester bonds (C-I)."},
{e:'n',t:"Disaccharides & polysaccharides",y:"NEET 2020",r:4,q:"Which of the following carbohydrates gives a positive Benedict's / Fehling's test because it possesses a free hemiacetal reducing group?",o:["Maltose and Lactose","Sucrose and Starch","Cellulose and Glycogen","Inulin and Trehalose"],a:0,s:"Maltose and lactose have an unbonded, free anomeric hemiacetal carbon at C1 of their second glucose unit capable of opening into an aldehyde, classifying them as reducing sugars."},
{e:'n',t:"Nucleic acids",y:"NEET 2019",r:4,q:"Chargaff's rules for double-stranded DNA state that:",o:["A = T and G = C, and (A + G) = (T + C)","A + T = G + C always","A/G = T/C","Ratio of (A+T)/(G+C) is always 1.0 for all organisms"],a:0,s:"Erwin Chargaff demonstrated that in double-stranded DNA, the molar ratio of Adenine equals Thymine (A=T) and Guanine equals Cytosine (G=C), meaning total purines equal total pyrimidines: A + G = T + C."},
{e:'n',t:"Enzymes",y:"NEET 2017",r:4,q:"Which of the following statements regarding enzyme inhibition is correct?",o:["Competitive inhibition is seen when a substrate and an inhibitor compete for the active site, increasing K<sub>m</sub> without changing V<sub>max</sub>","Non-competitive inhibition increases V<sub>max</sub>","Competitive inhibitors irreversibly denature the enzyme","Allosteric inhibitors bind directly to the active site"],a:0,s:"In competitive inhibition, the inhibitor structurally resembles the substrate, competing for the same active site. High substrate concentration can overcome this inhibition, so V<sub>max</sub> remains unchanged while the apparent affinity decreases (K<sub>m</sub> increases)."},
{e:'n',t:"Glucose & fructose",y:"NEET 2016 Phase-II",r:4,q:"Which of the following is an anomeric pair of carbohydrates?",o:["α-D-glucopyranose and β-D-glucopyranose","D-glucose and L-glucose","D-glucose and D-galactose","D-glucose and D-fructose"],a:0,s:"Anomers are cyclic diastereomers that differ in stereochemistry only at the hemiacetal/hemiketal carbon (C1 in aldoses, C2 in ketoses)."},
{e:'n',t:"Vitamins",y:"AIPMT 2015",r:4,q:"Xerophthalmia (hardening and drying of the cornea) and night blindness are caused by the dietary deficiency of:",o:["Vitamin A (Retinol)","Vitamin C","Vitamin D","Vitamin B₁"],a:0,s:"Vitamin A is essential for the rhodopsin visual pigment cycle and maintaining epithelial tissues; deficiency leads to night blindness and xerophthalmia."},
{e:'n',t:"Nucleic acids",y:"AIPMT 2014",r:4,q:"Which of the following sets represents purine nitrogenous bases found in nucleic acids?",o:["Adenine and Guanine","Cytosine and Thymine","Uracil and Cytosine","Thymine and Uracil"],a:0,s:"Purines are bicyclic nitrogenous heterocyclic compounds consisting of Adenine (A) and Guanine (G). Pyrimidines are monocyclic (Cytosine, Thymine, Uracil)."},
{e:'n',t:"Amino acids & proteins",y:"NEET 2023",r:4,q:"Which of the following bonds are not involved in tertiary structure of a protein?",o:["Hydrogen bonds","Disulphide bonds","Phosphodiester bonds","Hydrophobic interactions"],a:2,s:"Tertiary structure of proteins is stabilized by hydrogen bonds, ionic bonds, disulphide linkages, and hydrophobic interactions. Phosphodiester bonds are specific to the sugar-phosphate backbone of nucleic acids."},
{e:'n',t:"Amino acids & proteins",y:"NEET 2021",r:4,q:"Identify the basic amino acid from the following:",o:["Tyrosine","Glutamic acid","Lysine","Valine"],a:2,s:"Lysine possesses an extra amino group in its aliphatic side chain (-CH2-CH2-CH2-CH2-NH2), making it a basic amino acid."},
{e:'n',t:"Enzymes",y:"NEET 2020",r:4,q:"Consider the following statements:<br>(a) Coenzyme or metal ion that is very tightly bound to enzyme protein is called prosthetic group.<br>(b) A complete catalytic active enzyme with its bound prosthetic group is called apoenzyme.<br>Select the correct option:",o:["(a) is true, but (b) is false","Both (a) and (b) are true","(a) is false, but (b) is true","Both (a) and (b) are false"],a:0,s:"Prosthetic groups are organic compounds that are tightly bound to the apoenzyme. A complete catalytically active enzyme with its co-factor is called a holoenzyme, not an apoenzyme (which is the protein portion alone)."},
{e:'n',t:"Nucleic acids",y:"NEET 2019",r:4,q:"Which of the following statements about DNA is NOT correct?",o:["Two polynucleotide chains run anti-parallel","Pitch of the DNA helix is 3.4 nm with roughly 10 base pairs per turn","Adenine pairs with Uracil in B-DNA","Distance between two consecutive base pairs is about 0.34 nm"],a:2,s:"In DNA, Adenine pairs with Thymine (not Uracil) through two hydrogen bonds. Uracil replaces thymine only in RNA molecules."},
{e:'n',t:"Amino acids & proteins",y:"NEET 2018",r:4,q:"Which of the following is an example of an acidic amino acid containing two carboxyl groups?",o:["Glutamic acid","Lysine","Valine","Alanine"],a:0,s:"Glutamic acid (Glu) and Aspartic acid (Asp) possess a second carboxyl group in their side chains, giving them acidic properties."},
{e:'n',t:"Enzymes",y:"NEET 2017",r:4,q:"Which of the following describes the nature of enzyme action?",o:["Lock and key hypothesis alone","Transition state theory and induced-fit model","Irreversible chemical denaturation","Increasing the energy of activation"],a:1,s:"Koshland's induced fit model and Pauling's transition state stabilization theory accurately explain enzyme-substrate specificity and catalysis."},
{e:'n',t:"Vitamins",y:"NEET 2016 Phase-II",r:4,q:"Which of the following co-enzymes contains the vitamin niacin (nicotinic acid)?",o:["NAD and NADP","FAD","Coenzyme A","Thiamine pyrophosphate (TPP)"],a:0,s:"NAD (Nicotinamide adenine dinucleotide) and NADP contain the vitamin niacin (Vitamin B₃)."},

{e:'n',t:"Amino acids & proteins",y:"AIPMT 2014",r:4,q:"Which structural feature of proteins is represented by the specific linear sequence of amino acids in a polypeptide chain?",o:["Primary structure","Secondary structure","Tertiary structure","Quaternary structure"],a:0,s:"The linear sequence of amino acids linked together by peptide bonds forms the primary structure of a protein."},
{e:'n',t:"Enzymes",y:"AIPMT 2012 Mains",r:4,q:"Which of the following statements about enzymes is correct?",o:["Enzymes are denatured at high temperatures above 60-70 degrees Celsius","Enzymes increase the activation energy of a reaction","Enzymes are consumed during the chemical reaction","All enzymes are fibrous proteins"],a:0,s:"Most enzymes are globular proteins and are denatured by high heat due to disruption of secondary and tertiary folding."},
{e:'n',t:"Nucleic acids",y:"AIPMT 2012 Prelims",r:4,q:"In a 30 base pair double-stranded DNA segment, there are 20 Adenine bases. What is the total number of Cytosine bases?",o:["10","20","40","30"],a:0,s:"Total base pairs = 30 -&gt; Total bases = 60. By Chargaff's rule, A = T = 20. Total A + T = 40. Remaining bases = G + C = 60 - 40 = 20. Since G = C, Cytosine = 20 / 2 = 10."},

{e:'n',t:"Enzymes",y:"AIPMT 2004",r:4,q:"The Michaelis-Menten constant (K<sub>m</sub>) represents:",o:["Substrate concentration at which reaction velocity is half of maximum velocity (V<sub>max</sub>/2)","Maximum velocity of an enzyme","Optimum pH of the enzyme","Inhibitor concentration"],a:0,s:"K<sub>m</sub> is the substrate concentration at which the initial reaction velocity reaches half of its theoretical maximum (1/2 V<sub>max</sub>). Lower K<sub>m</sub> reflects higher enzyme-substrate affinity."},

<div class="notes">
 <div class="note"><h3>10.1 Carbohydrates</h3><ul><li>Optically active polyhydroxy aldehydes or ketones, or compounds that give them on hydrolysis; general formula C<sub>x</sub>(H₂O)<sub>y</sub> is a guide only (acetic acid fits but is not one; rhamnose C₆H₁₂O₅ does not fit but is one).</li><li><b>Monosaccharides:</b> not hydrolysable (glucose, fructose, ribose). <b>Oligosaccharides:</b> 2–10 units. <b>Polysaccharides:</b> many units, non-sugars (starch, cellulose, glycogen).</li><li>Reducing sugars reduce Fehling's and Tollens' reagents; all monosaccharides are reducing.</li><li>Aldose / ketose; triose to heptose by carbon count (Table 10.1).</li></ul></div>
 <div class="note"><h3>Glucose</h3><ul><li>Prepared by hydrolysis of sucrose (dil. HCl / H₂SO₄, alcohol) giving glucose + fructose, or of starch (dil. H₂SO₄, 393 K, 2–3 atm).</li><li>Evidence for open chain C₆H₁₂O₆: HI/Δ → n-hexane (straight chain); NH₂OH → oxime and HCN → cyanohydrin (C=O); Br₂ water → gluconic acid (CHO); acetic anhydride → pentaacetate (five –OH); HNO₃ → saccharic acid (primary –OH).</li><li>Fischer: D(+)-glucose; D/L refers to the lowest asymmetric carbon vs D-(+)-glyceraldehyde, not to d/l rotation.</li></ul></div>
 <div class="note"><h3>Cyclic structure of glucose</h3><ul><li>Not explained by open chain: no Schiff's test, no NaHSO₃ adduct, pentaacetate does not react with NH₂OH, and two crystalline forms (α m.p. 419 K at 303 K; β m.p. 423 K from hot saturated solution at 371 K).</li><li>C5–OH adds to CHO → six-membered <b>pyranose</b> hemiacetal; α and β differ at C1 (<b>anomeric carbon</b>) and are <b>anomers</b>. Haworth structures.</li></ul></div>
 <div class="note"><h3>Fructose</h3><ul><li>Ketohexose, C₆H₁₂O₆, C=O at C2, D-(−), laevorotatory.</li><li>C5–OH adds to C2 → five-membered <b>furanose</b> ring (α- and β-D-(−)-fructofuranose).</li></ul></div>
 <div class="note"><h3>Disaccharides</h3><ul><li><b>Sucrose:</b> α-D-glucose C1–C2 β-D-fructose; non-reducing; hydrolysis gives <b>invert sugar</b> (glucose +52.5°, fructose −92.4°).</li><li><b>Maltose:</b> two α-D-glucose, C1–C4; reducing.</li><li><b>Lactose:</b> β-D-galactose + β-D-glucose, C1–C4; milk sugar; reducing.</li><li>Link through oxygen = glycosidic linkage.</li></ul></div>
 <div class="note"><h3>Polysaccharides</h3><ul><li><b>Starch:</b> α-glucose polymer. Amylose 15–20%, water soluble, unbranched, C1–C4, 200–1000 units. Amylopectin 80–85%, insoluble, branched (C1–C4 chain, C1–C6 branches).</li><li><b>Cellulose:</b> β-D-glucose, C1–C4, straight chain, plant cell wall.</li><li><b>Glycogen:</b> animal starch, more branched than amylopectin; liver, muscles, brain; also yeast and fungi.</li><li>Importance: energy (honey, 'Vaids'), storage (starch, glycogen), cellulose for textiles, paper, wood. D-ribose and 2-deoxy-D-ribose occur in nucleic acids.</li></ul></div>
 <div class="note"><h3>10.2 Amino acids</h3><ul><li>α-amino acids R–CH(NH₂)–COOH; ~20 occur in proteins. Glycine (glykos = sweet), tyrosine (tyros = cheese).</li><li>Acidic, basic or neutral by relative number of –COOH and –NH₂. <b>Essential</b> (10, asterisked): Val, Leu, Ile, Arg, Lys, Thr, Met, Phe, Trp, His. Non-essential: synthesised in body.</li><li>Colourless crystalline, water soluble, high m.p., salt-like because of the <b>zwitter ion</b>; amphoteric. All except glycine are optically active; most are L.</li></ul></div>
 <div class="note"><h3>Proteins</h3><ul><li>Polymers of α-amino acids joined by <b>peptide (amide) linkages</b>; dipeptide, tripeptide … polypeptide (>10), protein (>100 residues, mass >10,000 u). Insulin has 51 residues.</li><li><b>Fibrous</b> (keratin, myosin; insoluble; H-bonds + S–S) vs <b>globular</b> (insulin, albumins; soluble).</li><li>Levels: primary (sequence), secondary (α-helix, β-pleated sheet; H-bonds C=O···H–N), tertiary (overall folding; H-bonds, disulphide, van der Waals, electrostatic), quaternary (subunits, e.g. haemoglobin).</li><li><b>Denaturation:</b> loss of secondary/tertiary structure by heat or pH change; primary intact; e.g. boiled egg, curdled milk.</li></ul></div>
 <div class="note"><h3>10.3 Enzymes</h3><ul><li>Biocatalysts, almost all globular proteins; specific for a reaction and substrate; named after substrate (maltase) or reaction (oxidoreductase); ending '-ase'.</li><li>Work under mild conditions, in small amounts; lower activation energy (sucrose hydrolysis: 6.22 kJ mol⁻¹ with acid, 2.15 kJ mol⁻¹ with sucrase).</li></ul></div>
 <div class="note w"><h3>10.4 Vitamins</h3><p style="margin:0 0 8px">Organic compounds needed in small amounts for growth and health. 'Vitamine' = vital + amine. Fat soluble: A, D, E, K (stored in liver/adipose). Water soluble: B group and C (excreted; B₁₂ is stored).</p><table><tr><th>Vitamin</th><th>Source</th><th>Deficiency disease</th></tr>
 <tr><td>A</td><td>Fish liver oil, carrots, butter, milk</td><td>Xerophthalmia, night blindness</td></tr>
 <tr><td>B₁ (thiamine)</td><td>Yeast, milk, green vegetables, cereals</td><td>Beri-beri (loss of appetite, retarded growth)</td></tr>
 <tr><td>B₂ (riboflavin)</td><td>Milk, egg white, liver, kidney</td><td>Cheilosis, digestive disorders, burning sensation of skin</td></tr>
 <tr><td>B₆ (pyridoxine)</td><td>Yeast, milk, egg yolk, cereals, grams</td><td>Convulsions</td></tr>
 <tr><td>B₁₂</td><td>Meat, fish, egg, curd</td><td>Pernicious anaemia</td></tr>
 <tr><td>C (ascorbic acid)</td><td>Citrus fruits, amla, green leafy vegetables</td><td>Scurvy (bleeding gums)</td></tr>
 <tr><td>D</td><td>Sunlight, fish, egg yolk</td><td>Rickets, osteomalacia</td></tr>
 <tr><td>E</td><td>Vegetable oils (wheat germ, sunflower)</td><td>Fragile RBCs, muscular weakness</td></tr>
 <tr><td>K</td><td>Green leafy vegetables</td><td>Increased blood clotting time</td></tr></table></div>
 <div class="note"><h3>10.5 Nucleic acids</h3><ul><li>DNA and RNA: long-chain polymers of <b>nucleotides</b> (polynucleotides); in chromosomes with proteins; carry heredity.</li><li>Complete hydrolysis → pentose sugar, phosphoric acid, bases. DNA: β-D-2-deoxyribose; RNA: β-D-ribose.</li><li>DNA bases A, G, C, T; RNA bases A, G, C, U.</li></ul></div>
 <div class="note"><h3>Structure of nucleic acids</h3><ul><li><b>Nucleoside</b> = base at C1′ of sugar. <b>Nucleotide</b> = nucleoside + phosphate at C5′.</li><li>Joined by <b>phosphodiester</b> links between 5′ and 3′ carbons. Base sequence = primary structure.</li><li>DNA: double helix (Watson and Crick); strands complementary by H-bonds, A=T (2), C≡G (3).</li><li>RNA: single strand, sometimes folded; m-RNA, r-RNA, t-RNA.</li></ul></div>
 <div class="note"><h3>Biological function; people</h3><ul><li>DNA: chemical basis of heredity; self-duplicates in cell division; protein synthesis is carried out by RNA but the message is in DNA.</li><li><b>Watson</b> (Nobel 1962 with Crick and Wilkins): double helix. <b>Har Gobind Khorana</b> (Nobel 1968 with Nirenberg and Holley): cracking the genetic code.</li><li>DNA fingerprinting: forensic identification, paternity, identifying bodies, tracing racial groups.</li></ul></div>
 <div class="note"><h3>10.6 Hormones</h3><ul><li>Intercellular messengers from endocrine (ductless) glands. Steroids (oestrogens, androgens); polypeptides (insulin, endorphins); amino acid derivatives (epinephrine, norepinephrine).</li><li>Insulin lowers blood glucose; glucagon raises it. Thyroxine (iodinated tyrosine): low → hypothyroidism (lethargy, obesity; goitre if iodine is low); high → hyperthyroidism.</li><li>Adrenal cortex: glucocorticoids (carbohydrate metabolism, stress), mineralocorticoids (water and salt). Addison's disease: adrenal cortex failure. Testosterone: male characters; estradiol: female characters and menstrual cycle; progesterone: implantation.</li></ul></div>
 <div class="note w"><h3>NCERT in-text questions: short answers</h3><ul>
  <li><b>10.1</b> Glucose and sucrose form H-bonds with water through many –OH groups; cyclohexane and benzene cannot.</li>
  <li><b>10.2</b> Lactose → D-galactose + D-glucose.</li>
  <li><b>10.3</b> Pentaacetate does not react with NH₂OH: no free –CHO; glucose exists in the cyclic hemiacetal form.</li>
  <li><b>10.4</b> Amino acids are zwitter ions (ionic, salt-like), so higher m.p. and solubility than halo acids.</li>
  <li><b>10.5</b> On boiling, the proteins coagulate (denature) and the water is held within the coagulated protein network.</li>
  <li><b>10.6</b> Vitamin C is water soluble and is excreted in urine.</li>
  <li><b>10.7</b> 2-Deoxyribose, phosphoric acid and thymine (hydrolysis of a DNA nucleotide, with the base).</li>
  <li><b>10.8</b> RNA is single stranded, so there is no complementary base pairing to fix base ratios.</li></ul></div>
</div>`;

const $=s=>document.querySelector(s);
let view='home', mode={k:'quiz',n:'quiz'}, filt={k:'All',n:'All'}, ans={};
try{ans=JSON.parse(localStorage.getItem('bm_ans2')||'{}')}catch(e){ans={}}
function save(){try{localStorage.setItem('bm_ans2',JSON.stringify(ans))}catch(e){}}
const set=e=>Q.filter(q=>q.e===e);
function stat(e){const s=set(e);let a=0,c=0;s.forEach(q=>{if(ans[q.id]!==undefined){a++;if(ans[q.id]===q.a)c++}});return{t:s.length,a,c}}
function go(v,m){view=v;if(m&&(v==='k'||v==='n'))mode[v]=m;render();window.scrollTo(0,0)}
const RB={1:'options rebuilt',2:'question reconstructed',3:'options paraphrased from listing',4:'from Gemini file · year tag unverified',5:'verified against paper listing',6:'from Gemini file · no year given'};

function home(){
  const k=stat('k'),n=stat('n'),pc=x=>x.a?Math.round(100*x.c/x.a):0;
  return `<section class="hero"><span class="pill">Complete Chemistry Exam Preparation Portal • NCERT Class 12 Chapter 10</span>
  <h1>Biomolecules: KCET &amp; NEET PYQ Portal</h1>
  <p>${Q.length}-question practice bank covering all 27 KCET Biomolecules questions listed for 2017–2026 and NEET/AIPMT questions listed for 2007–2019, with NEET/KCET-pattern practice, plus 88 further questions merged from a second compiled bank (enzymes, DNA/RNA, epimers, Re-NEET 2026 and more). Features glucose structure evidence, anomers, glycosidic linkages, zwitter ions, vitamin deficiency matches, DNA/RNA chemistry, dual study modes and full NCERT revision notes.</p>
  <button class="btn b1" onclick="go('k','read')">Open KCET Bank (${k.t} Qs)</button>
  <button class="btn b2" onclick="go('n','read')">Open NEET PYQ Bank (${n.t} Qs)</button>
  <button class="btn b3" onclick="go('notes')">View Revision Notes</button></section>
  <div class="stats">
   <div class="st"><small>TOTAL PORTAL BANK</small><div class="n">${Q.length} Questions</div><div class="s">${k.t} KCET + ${n.t} NEET items</div></div>
   <div class="st"><small style="color:var(--ind)">KCET PRACTICE PROGRESS</small><div class="n" style="color:var(--ind)">${k.a} / ${k.t}</div><div class="s">Score: ${k.c} correct (${pc(k)}%)</div><div class="bar"><i style="width:${100*k.a/k.t}%"></i></div></div>
   <div class="st"><small style="color:var(--grn)">NEET PRACTICE PROGRESS</small><div class="n" style="color:var(--grn)">${n.a} / ${n.t}</div><div class="s">Score: ${n.c} correct (${pc(n)}%)</div><div class="bar"><i style="width:${100*n.a/n.t}%;background:var(--grn)"></i></div></div></div>
  <div class="mods">
   <div class="mod"><span class="tg">Module 1 • Q1–Q${k.t}</span><h3>KCET Biomolecules Question Bank</h3><p>Match-the-list on vitamin B deficiencies (KCET 2026) and glucose reagents (KCET 2025), invert sugar (2023), thyroxine from tyrosine (2023), nucleotide linkage (2024), complementary DNA strand GATGC (2021), amylose glycosidic link (2018), sucrose link (2017) and more. Now also enzyme steps and cellulose (KCET 2026 Biology paper), glycine, zwitter ions, amylopectin, B-vitamins and nucleic acid structure.</p><button class="btn p1" onclick="go('k','read')">Read Question Bank</button><button class="btn p2" onclick="go('k','quiz')">Start Practice Quiz</button></div>
   <div class="mod g"><span class="tg">Module 2 • Q1–Q${n.t}</span><h3>NEET PYQ Biomolecules Question Bank</h3><p>AIPMT 2007 dihydroxyacetone, AIPMT 2012 sucrose building blocks, AIPMT 2014 non-reducing sugar, chitin (NEET 2013, 2015, 2016), NEET 2016 protein folding forces, NEET 2018 sugar functional groups and epinephrine, plus NEET-pattern practice and A/R items. Now also Re-NEET 2026 matches, enzyme classes and cofactors, Chargaff's rules, epimers, competitive inhibition and more.</p><button class="btn p1" onclick="go('n','read')">Read Question Bank</button><button class="btn p2" onclick="go('n','quiz')">Start Practice Quiz</button></div>
  </div>
  <p class="disc">Source note: The KCET listing gave every stem but not the options, so options and solutions marked "options rebuilt" or "question reconstructed" were written here. NEET items with a year come from a chapter-wise listing (options paraphrased); "NEET-type" and "KCET-type" are pattern practice with no claimed year. Questions marked "from Gemini file" were merged from a second compiled bank: their year tags could not be verified and some conflict with the paper listings above, so treat them as practice items (green "verified" badges were checked against a published paper listing). Gemini questions that duplicated an existing one, or whose answer key could not be confirmed, were left out. Two NEET structure-diagram questions (AIPMT 2011 and 2012) are not included because the structures could not be reproduced reliably. Cross-check against official KEA/NTA papers before relying on a specific year or option order.</p>`;
}

function qcard(q,i,m){
  const L='ABCD', done=ans[q.id]!==undefined, isQ=m==='quiz';
  const opts=q.o.map((o,j)=>{
    let c='opt';
    if(isQ&&done){if(j===q.a)c+=' ok';else if(j===ans[q.id])c+=' bad'}
    if(!isQ&&show[q.id]&&j===q.a)c+=' ok';
    return `<button class="${c}" ${isQ?(done?'disabled':`onclick="pick(${q.id},${j})"`):'tabindex="-1"'}><b>${L[j]}.</b>${o}</button>`}).join('');
  const reveal=isQ?done:show[q.id];
  return `<div class="q ${q.e==='n'?'g':''} ${isQ?'':'rd'}"><div class="meta"><span class="no">Q${i+1}</span><span class="tag">${q.y}</span><span class="tp">${q.t}</span>${q.r?`<span class="rb${q.r===5?' v':''}">${RB[q.r]}</span>`:''}</div>
  <p>${q.q}</p>${opts}
  ${!isQ?`<button class="link" onclick="tog(${q.id})">${reveal?'Hide answer':'Show answer'}</button>`:''}
  ${reveal?`<div class="sol"><b>Answer: ${L[q.a]}.</b> ${q.s}${isQ&&done?(ans[q.id]===q.a?' ✔':' ✘'):''}</div>`:''}</div>`;
}
const show={};
function pick(id,j){ans[id]=j;save();render(true)}
function tog(id){show[id]=!show[id];render(true)}
function resetBank(e){set(e).forEach(q=>delete ans[q.id]);save();render()}
function setF(e,f){filt[e]=f;render()}

function bank(e){
  const name=e==='k'?'KCET':'NEET PYQ', s=stat(e), m=mode[e];
  const topics=['All',...new Set(set(e).map(q=>q.t))];
  const list=set(e).filter(q=>filt[e]==='All'||q.t===filt[e]);
  const all=set(e);
  return `<div class="top"><h2>${name} Biomolecules Question Bank</h2>
   <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span style="color:var(--mut);font-size:.84rem">${s.a}/${s.t} attempted • ${s.c} correct</span>
   <div class="seg"><button class="${m==='read'?'on':''}" onclick="go('${e}','read')">Read</button><button class="${m==='quiz'?'on':''}" onclick="go('${e}','quiz')">Practice Quiz</button></div>
   ${m==='quiz'?`<button class="reset" onclick="resetBank('${e}')">Reset</button>`:''}</div></div>
   <div class="filt">${topics.map(t=>`<button class="${filt[e]===t?'on':''}" onclick="setF('${e}',this.dataset.t)" data-t="${t}">${t}</button>`).join('')}</div>
   ${list.map(q=>qcard(q,all.indexOf(q),m)).join('')}`;
}

function render(keep){
  const y=window.scrollY;
  $('#kn').textContent=set('k').length;$('#nn').textContent=set('n').length;$('#hdrN').textContent=Q.length;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  $('#app').innerHTML = view==='home'?home():view==='notes'?`<div class="top"><h2>Revision Notes</h2></div>${NOTES}`:bank(view);
  if(keep)window.scrollTo(0,y);
}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)});
render();
</script>
</body>
</html>
